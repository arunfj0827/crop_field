<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Yield Predictor | AI-Powered Agriculture</title>
    <!-- Premium Font: Outfit & Playfair Display -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
    <!-- Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        },
                        accent: {
                            gold: '#fbbf24',
                            sky: '#0ea5e9',
                            slate: '#0f172a',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                        'slide-up': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                    }
                }
            }
        }
    </script>
    <style>
        .glass-dark {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-light {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .premium-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        .hero-gradient {
            background: radial-gradient(circle at 50% 50%, #f0fdf4 0%, #ffffff 100%);
        }

        .stagger-in>* {
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stagger-in>*:nth-child(1) {
            animation-delay: 0.1s;
        }

        .stagger-in>*:nth-child(2) {
            animation-delay: 0.2s;
        }

        .stagger-in>*:nth-child(3) {
            animation-delay: 0.3s;
        }

        .stagger-in>*:nth-child(4) {
            animation-delay: 0.4s;
        }

        body {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Custom Tooltip Styling */
        .recharts-default-tooltip {
            background-color: rgba(15, 23, 42, 0.9) !important;
            border-radius: 12px !important;
            border: none !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
        }
    </style>
</head>

<body class="hero-gradient min-h-screen text-accent-slate">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Cell, AreaChart, Area, PieChart, Pie } = Recharts;

        // --- Premium Components ---

        const LucideIcon = ({ name, className = "", size = 20 }) => {
            const [icon, setIcon] = useState(null);
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    setIcon(window.lucide.icons[name]);
                }
            }, [name]);
            if (!icon) return null;
            return <i data-lucide={name.toLowerCase()} className={className} style={{ width: size, height: size }}></i>;
        };

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        }, []);

        const AnimatedCounter = ({ value, duration = 2 }) => {
            const [count, setCount] = useState(0);
            useEffect(() => {
                let start = 0;
                const end = parseFloat(value);
                if (start === end) return;
                let totalMilisecondsChildOut = duration * 1000;
                let stepTime = Math.abs(Math.floor(totalMilisecondsChildOut / end));
                let timer = setInterval(() => {
                    start += 1;
                    setCount(start);
                    if (start >= end) clearInterval(timer);
                }, stepTime);
                return () => clearInterval(timer);
            }, [value, duration]);
            return <span>{count.toLocaleString()}</span>;
        };

        // --- Main App ---

        const App = () => {
            const [page, setPage] = useState('home');
            const [prediction, setPrediction] = useState(null);
            const [loading, setLoading] = useState(false);
            const [formData, setFormData] = useState({
                region: '', crop: '', season: '', soilType: '',
                temperature: 25, humidity: 60, rainfall: 200
            });

            const handleRequest = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const res = await axios.post('http://localhost:8080/api/predictions', formData);
                    setPrediction(res.data);
                    setPage('dashboard');
                    setTimeout(() => window.lucide.createIcons(), 100);
                } catch (err) {
                    alert("⚠️ Connection Failed: Please ensure 'backend' and 'ml-service' are running on ports 8080 and 8000.");
                } finally {
                    setLoading(false);
                }
            };

            if (page === 'home') {
                return (
                    <div className="relative">
                        {/* Decorative background elements */}
                        <div className="absolute top-0 right-0 w-96 h-96 bg-brand-100 rounded-full blur-[120px] -mr-48 -mt-48 opacity-60"></div>
                        <div className="absolute bottom-0 left-0 w-96 h-96 bg-blue-100 rounded-full blur-[120px] -ml-48 -mb-48 opacity-60"></div>

                        <div className="max-w-7xl mx-auto px-6 pt-20 pb-32">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
                                {/* Hero Content */}
                                <div className="animate-fade-in space-y-8">
                                    <div className="inline-flex items-center space-x-2 px-4 py-2 bg-brand-100/50 rounded-full border border-brand-200">
                                        <span className="w-2 h-2 bg-brand-500 rounded-full animate-pulse"></span>
                                        <span className="text-xs font-bold text-brand-700 uppercase tracking-widest leading-none">AI-Driven Agriculture</span>
                                    </div>
                                    <h1 className="text-6xl md:text-7xl font-black leading-tight">
                                        Harvesting <br />
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-600 to-emerald-800">Intelligence.</span>
                                    </h1>
                                    <p className="text-xl text-slate-500 max-w-lg leading-relaxed">
                                        Predict crop yields with scientific precision. Our system analyzes environmental factors using advanced ML models to minimize risk and maximize your profit.
                                    </p>

                                    <div className="flex items-center space-x-8 pt-4">
                                        <div className="flex -space-x-3">
                                            {[1, 2, 3, 4].map(i => (
                                                <div key={i} className="w-12 h-12 rounded-full border-4 border-white bg-slate-200 overflow-hidden">
                                                    <img src={`https://i.pravatar.cc/150?img=${i + 10}`} alt="User" />
                                                </div>
                                            ))}
                                        </div>
                                        <p className="text-sm font-semibold text-slate-400">Trusted by <span className="text-slate-900">500+</span> agrarian researchers</p>
                                    </div>
                                </div>

                                {/* Form Section */}
                                <div className="animate-slide-up">
                                    <div className="glass-light premium-shadow rounded-[3rem] p-10 relative overflow-hidden">
                                        <div className="absolute top-0 right-0 p-8 opacity-5">
                                            {/* Static Icon Reference */}
                                            <svg className="w-32 h-32" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z" /></svg>
                                        </div>

                                        <h3 className="text-2xl font-bold mb-8 flex items-center">
                                            <span className="w-8 h-8 rounded-lg bg-brand-500 text-white flex items-center justify-center mr-3">
                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" /></svg>
                                            </span>
                                            Input Data Parameters
                                        </h3>

                                        <form onSubmit={handleRequest} className="space-y-6">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                {[
                                                    { id: 'region', label: 'Region / State', placeholder: 'e.g. Maharashtra' },
                                                    { id: 'crop', label: 'Crop Variety', placeholder: 'e.g. Wheat' },
                                                    { id: 'season', label: 'Farming Season', placeholder: 'e.g. Rabi' },
                                                    { id: 'soilType', label: 'Soil Composition', placeholder: 'e.g. Alluvial' }
                                                ].map(f => (
                                                    <div key={f.id} className="group">
                                                        <label className="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide group-focus-within:text-brand-600 transition-colors">{f.label}</label>
                                                        <input
                                                            required type="text"
                                                            className="w-full px-6 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-brand-500 focus:bg-white outline-none transition-all placeholder:text-slate-300 font-medium"
                                                            placeholder={f.placeholder}
                                                            onChange={e => setFormData({ ...formData, [f.id]: e.target.value })}
                                                        />
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="pt-4 border-t border-slate-100">
                                                <div className="grid grid-cols-3 gap-4 mb-8">
                                                    {[
                                                        { id: 'temperature', label: 'Temp °C', val: 25 },
                                                        { id: 'humidity', label: 'Hum. %', val: 60 },
                                                        { id: 'rainfall', label: 'Rain mm', val: 200 }
                                                    ].map(f => (
                                                        <div key={f.id} className="text-center">
                                                            <div className="text-[10px] font-black text-slate-400 uppercase mb-2">{f.label}</div>
                                                            <input
                                                                type="number" step="0.1"
                                                                className="w-full px-3 py-3 rounded-xl bg-slate-100 text-center font-bold text-brand-900 outline-none focus:ring-2 focus:ring-brand-500 transition-all"
                                                                value={formData[f.id]}
                                                                onChange={e => setFormData({ ...formData, [f.id]: parseFloat(e.target.value) })}
                                                            />
                                                        </div>
                                                    ))}
                                                </div>

                                                <button
                                                    disabled={loading}
                                                    className="w-full py-5 rounded-[2rem] bg-accent-slate text-white font-black text-xl hover:bg-slate-800 transform active:scale-[0.97] transition-all shadow-2xl flex items-center justify-center space-x-4"
                                                >
                                                    {loading ? (
                                                        <>
                                                            <span className="w-5 h-5 border-2 border-white/20 border-t-white rounded-full animate-spin"></span>
                                                            <span className="opacity-80">Synchronizing AI...</span>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <span>Initialize AI Prediction</span>
                                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M13 5l7 7-7 7M5 5l7 7-7 7" /></svg>
                                                        </>
                                                    )}
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- Dashboard View ---

            const shapData = prediction.shapValues ?
                Object.entries(JSON.parse(prediction.shapValues.replace(/'/g, '"')))
                    .map(([name, value]) => ({
                        name: name.toUpperCase(),
                        impact: parseFloat(value.toFixed(3))
                    })) : [];

            return (
                <div className="min-h-screen bg-slate-50">
                    {/* Header */}
                    <nav className="glass-light sticky top-0 z-50 px-8 py-4 border-b border-slate-200">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center shadow-lg shadow-brand-200">
                                    <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
                                </div>
                                <span className="font-black text-xl tracking-tight uppercase">Dashboard <span className="text-brand-600">v2.0</span></span>
                            </div>
                            <button onClick={() => setPage('home')} className="flex items-center space-x-2 text-sm font-bold bg-white px-6 py-2.5 rounded-full shadow-sm border border-slate-100 hover:border-brand-500 transition-all text-slate-500 hover:text-brand-600">
                                <LucideIcon name="LogOut" size={14} /> <span>New Analysis</span>
                            </button>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-6 py-12">
                        {/* Summary Section */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12 stagger-in">
                            {[
                                { label: 'Estimated Yield', val: prediction.predictedYield, unit: 'KG / HECTARE', icon: 'TrendingUp', color: '#16a34a', bg: '#f0fdf4' },
                                { label: 'System Risk Score', val: (prediction.riskScore * 100).toFixed(1), unit: 'STABILITY INDEX %', icon: 'ShieldAlert', color: '#f59e0b', bg: '#fffbeb' },
                                { label: 'Potential Revenue', val: prediction.profitEstimation, unit: 'ESTIMATED INR', icon: 'IndianRupee', color: '#0ea5e9', bg: '#f0f9ff' }
                            ].map((stat, i) => (
                                <div key={i} className="glass-light p-8 rounded-[2.5rem] shadow-xl border-b-8 transition-transform hover:-translate-y-2 group" style={{ borderColor: stat.color }}>
                                    <div className="flex justify-between items-start mb-6">
                                        <div className="p-4 rounded-2xl group-hover:scale-110 transition-transform" style={{ backgroundColor: stat.bg, color: stat.color }}>
                                            <LucideIcon name={stat.icon} size={24} />
                                        </div>
                                        <div className="text-[10px] font-black text-slate-400 tracking-[0.2em]">{stat.label}</div>
                                    </div>
                                    <div className="text-4xl font-black text-slate-900 mb-1">
                                        {i === 1 ? stat.val : <AnimatedCounter value={stat.val} duration={1.5} />}
                                        <span className="text-lg font-bold ml-1 text-slate-300">{i === 1 ? '%' : ''}</span>
                                    </div>
                                    <div className="text-[10px] font-bold text-slate-400">{stat.unit}</div>
                                </div>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start stagger-in">
                            {/* AI Insights & Recommendation */}
                            <div className="lg:col-span-4 space-y-8">
                                <div className="glass-dark p-10 rounded-[3rem] text-white shadow-2xl relative overflow-hidden">
                                    <div className="absolute -top-10 -right-10 w-40 h-40 bg-brand-500/20 rounded-full blur-3xl"></div>
                                    <h3 className="text-2xl font-bold mb-8 flex items-center">
                                        <LucideIcon name="Bot" className="text-brand-500 mr-3" /> AI Verdict
                                    </h3>
                                    <div className="p-6 bg-white/5 border border-white/10 rounded-3xl mb-10 leading-relaxed font-light text-slate-300">
                                        <span className="text-brand-400 font-bold block mb-2 text-xs uppercase tracking-widest">Scientific Overview</span>
                                        "{prediction.explanation}"
                                    </div>

                                    <div className="space-y-4">
                                        <h4 className="text-sm font-bold text-slate-400 uppercase tracking-widest">Recommended Actions</h4>
                                        {[
                                            'Nitrogen optimization based on soil data',
                                            'Controlled moisture irrigation cycle',
                                            'Post-harvest rotation planning'
                                        ].map((act, i) => (
                                            <div key={i} className="flex items-center space-x-3 text-sm">
                                                <div className="w-5 h-5 rounded-full bg-brand-600/30 text-brand-500 flex items-center justify-center flex-shrink-0">
                                                    <LucideIcon name="Check" size={12} />
                                                </div>
                                                <span className="text-slate-100">{act}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-light p-8 rounded-[2.5rem] border-l-8 border-accent-sky shadow-lg">
                                    <h4 className="text-xs font-black text-slate-400 mb-4 uppercase tracking-widest italic">Climate Context</h4>
                                    <div className="flex items-center justify-between text-slate-900 border-b border-slate-100 pb-3 mb-3">
                                        <span className="text-sm font-semibold">Stability Index</span>
                                        <span className="text-sm font-bold text-accent-sky">Advanced</span>
                                    </div>
                                    <p className="text-xs text-slate-500 leading-relaxed">System confidence is optimized using historical climate buffers in {formData.region}.</p>
                                </div>
                            </div>

                            {/* SHAP Visualizer */}
                            <div className="lg:col-span-8 glass-light p-10 rounded-[3rem] shadow-xl">
                                <div className="flex justify-between items-end mb-12">
                                    <div>
                                        <h3 className="text-2xl font-black mb-2 flex items-center">
                                            <LucideIcon name="Activity" className="text-brand-600 mr-3" /> Explainable AI
                                        </h3>
                                        <p className="text-sm text-slate-400 font-medium tracking-tight">SHAP Visualization: Feature Impact Analysis</p>
                                    </div>
                                    <div className="flex space-x-4">
                                        <div className="flex items-center space-x-2"><span className="w-3 h-3 rounded bg-brand-500"></span><span className="text-[10px] font-bold text-slate-400">Positive Impact</span></div>
                                        <div className="flex items-center space-x-2"><span className="w-3 h-3 rounded bg-red-500"></span><span className="text-[10px] font-bold text-slate-400">Negative Impact</span></div>
                                    </div>
                                </div>

                                <div className="h-[400px]">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={shapData} layout="vertical" margin={{ left: 20 }}>
                                            <CartesianGrid strokeDasharray="4 4" horizontal={false} stroke="#f1f5f9" />
                                            <XAxis type="number" hide />
                                            <YAxis dataKey="name" type="category" width={110} tick={{ fontSize: 11, fontWeight: 900, fill: '#64748b' }} axisLine={false} tickLine={false} />
                                            <Tooltip cursor={{ fill: '#f8fafc' }} />
                                            <Bar dataKey="impact" radius={[0, 10, 10, 0]} barSize={32}>
                                                {shapData.map((entry, index) => (
                                                    <Cell key={index} fill={entry.impact > 0 ? '#16a34a' : '#ef4444'} />
                                                ))}
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                                <div className="mt-10 p-6 bg-slate-100 rounded-3xl border border-slate-200">
                                    <div className="flex items-start space-x-4">
                                        <LucideIcon name="Info" className="text-slate-400 mt-1" />
                                        <p className="text-xs text-slate-500 leading-relaxed font-medium">
                                            The SHAP (SHapley Additive exPlanations) values above quantify the relative contribution of each environmental parameter to the final yield prediction. Positive values (green) pushed the prediction higher, while negative values (red) pulled it down from the base average.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="max-w-7xl mx-auto px-12 py-12 text-center text-[10px] font-bold text-slate-300 uppercase tracking-[0.4em]">
                        Developed by Advanced Core Engineering &bull; AgriTech Intelligence
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
